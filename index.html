<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>Football Clash</title>

<style>
*{box-sizing:border-box}
body{
 margin:0;
 background:#07111f;
 color:white;
 font-family:Arial,sans-serif;
 overflow:hidden;
 touch-action:none;
}

#menu{
 height:100vh;
 display:flex;
 flex-direction:column;
 align-items:center;
 justify-content:center;
 text-align:center;
}

h1{
 font-size:48px;
 margin:0 0 8px;
}

.sub{
 color:#b9c7d8;
 margin-bottom:25px;
}

button{
 border:0;
 border-radius:14px;
 padding:15px 28px;
 margin:7px;
 font-size:18px;
 font-weight:bold;
 cursor:pointer;
}

.play{
 background:#19d36b;
 color:#04120a;
}

#game{
 display:none;
 width:100vw;
 height:100vh;
 position:relative;
}

canvas{
 display:block;
 margin:auto;
 background:#238b45;
 width:min(100vw,1100px);
 height:auto;
 max-height:78vh;
}

#score{
 position:absolute;
 top:10px;
 left:50%;
 transform:translateX(-50%);
 background:rgba(0,0,0,.7);
 padding:10px 22px;
 border-radius:15px;
 font-size:22px;
 font-weight:bold;
 z-index:3;
}

#timer{
 font-size:16px;
 color:#ddd;
}

#controls{
 position:absolute;
 bottom:15px;
 left:0;
 right:0;
 display:flex;
 justify-content:space-between;
 padding:0 20px;
 pointer-events:none;
}

.controlGroup{
 display:flex;
 gap:10px;
 pointer-events:auto;
}

.control{
 width:68px;
 height:68px;
 border-radius:50%;
 background:rgba(0,0,0,.55);
 color:white;
 border:2px solid rgba(255,255,255,.3);
 font-size:25px;
 margin:0;
 padding:0;
}

#shoot{
 width:85px;
 height:85px;
 background:#e63946;
}

#sprint{
 background:#f4a261;
}

#message{
 position:absolute;
 top:50%;
 left:50%;
 transform:translate(-50%,-50%);
 font-size:42px;
 font-weight:bold;
 text-shadow:0 4px 10px black;
 display:none;
 z-index:5;
}

#end{
 display:none;
 position:absolute;
 inset:0;
 background:rgba(0,0,0,.86);
 z-index:20;
 align-items:center;
 justify-content:center;
 flex-direction:column;
 text-align:center;
}

#end h2{
 font-size:44px;
 margin:10px;
}
</style>
</head>

<body>

<div id="menu">
 <h1>⚽ FOOTBALL CLASH</h1>
 <div class="sub">You vs Smart AI</div>
 <button class="play" onclick="startGame()">🏟️ PLAY MATCH</button>
 <p>Keyboard: WASD / Arrow Keys • Space = Shoot</p>
</div>

<div id="game">

 <div id="score">
  YOU <span id="myScore">0</span>
  &nbsp; - &nbsp;
  <span id="aiScore">0</span> AI
  <div id="timer">03:00</div>
 </div>

 <div id="message">GOAL! ⚽</div>

 <canvas id="canvas" width="1100" height="650"></canvas>

 <div id="controls">

  <div class="controlGroup">
   <button class="control" id="up">⬆️</button>
   <button class="control" id="down">⬇️</button>
   <button class="control" id="left">⬅️</button>
   <button class="control" id="right">➡️</button>
  </div>

  <div class="controlGroup">
   <button class="control" id="sprint">⚡</button>
   <button class="control" id="shoot">⚽</button>
  </div>

 </div>

 <div id="end">
  <h2 id="endTitle">FULL TIME</h2>
  <p id="endScore"></p>
  <button class="play" onclick="location.reload()">PLAY AGAIN</button>
 </div>

</div>

<script>

const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

const W=canvas.width;
const H=canvas.height;

const field={
 left:70,
 right:1030,
 top:55,
 bottom:595
};

const goal={
 top:270,
 bottom:380,
 depth:35
};

let running=false;
let timeLeft=180;

let myScore=0;
let aiScore=0;

let keys={};

let player={
 x:250,
 y:325,
 r:20,
 speed:3.5,
 sprint:1
};

let ai={
 x:850,
 y:325,
 r:20,
 speed:2.8
};

let ball={
 x:550,
 y:325,
 r:11,
 vx:0,
 vy:0
};

let goalkeeper={
 x:990,
 y:325,
 r:18
};

let aiGoalkeeper={
 x:110,
 y:325,
 r:18
};

let lastTime=performance.now();
let shotCooldown=0;
let goalPause=0;

function resetPositions(){

 player.x=250;
 player.y=325;

 ai.x=850;
 ai.y=325;

 goalkeeper.x=990;
 goalkeeper.y=325;

 aiGoalkeeper.x=110;
 aiGoalkeeper.y=325;

 ball.x=550;
 ball.y=325;
 ball.vx=0;
 ball.vy=0;

}

function startGame(){

 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";

 running=true;
 lastTime=performance.now();

 resetPositions();

 requestAnimationFrame(loop);

 setInterval(()=>{
  if(!running)return;

  timeLeft--;

  let m=Math.floor(timeLeft/60);
  let s=timeLeft%60;

  document.getElementById("timer").innerText=
   String(m).padStart(2,"0")+":"+
   String(s).padStart(2,"0");

  if(timeLeft<=0){
   finishGame();
  }

 },1000);
}

function clamp(v,a,b){
 return Math.max(a,Math.min(b,v));
}

function distance(a,b){
 return Math.hypot(a.x-b.x,a.y-b.y);
}

function movePlayer(){

 let dx=0;
 let dy=0;

 if(keys["ArrowUp"]||keys["w"])dy--;
 if(keys["ArrowDown"]||keys["s"])dy++;
 if(keys["ArrowLeft"]||keys["a"])dx--;
 if(keys["ArrowRight"]||keys["d"])dx++;

 if(dx||dy){

  let len=Math.hypot(dx,dy);

  dx/=len;
  dy/=len;

  let speed=player.speed;

  if(keys["Shift"]||keys["sprint"])
   speed*=1.7;

  player.x+=dx*speed;
  player.y+=dy*speed;
 }

 player.x=clamp(
  player.x,
  field.left+player.r,
  field.right-player.r
 );

 player.y=clamp(
  player.y,
  field.top+player.r,
  field.bottom-player.r
 );

}

function kickBall(){

 if(shotCooldown>0)return;

 if(distance(player,ball)<58){

  let dx=ball.x-player.x;
  let dy=ball.y-player.y;

  let len=Math.hypot(dx,dy);

  if(len<1)len=1;

  dx/=len;
  dy/=len;

  ball.vx=dx*10;
  ball.vy=dy*10;

  shotCooldown=25;
 }
}

function ballPhysics(){

 ball.x+=ball.vx;
 ball.y+=ball.vy;

 ball.vx*=0.985;
 ball.vy*=0.985;

 if(Math.abs(ball.vx)<.05)ball.vx=0;
 if(Math.abs(ball.vy)<.05)ball.vy=0;

 // top/bottom walls
 if(ball.y-ball.r<field.top){
  ball.y=field.top+ball.r;
  ball.vy*=-.75;
 }

 if(ball.y+ball.r>field.bottom){
  ball.y=field.bottom-ball.r;
  ball.vy*=-.75;
 }

 // left wall except goal
 if(ball.x-ball.r<field.left){

  if(ball.y<goal.top||ball.y>goal.bottom){
   ball.x=field.left+ball.r;
   ball.vx*=-.75;
  }

 }

 // right wall except goal
 if(ball.x+ball.r>field.right){

  if(ball.y<goal.top||ball.y>goal.bottom){
   ball.x=field.right-ball.r;
   ball.vx*=-.75;
  }

 }

 checkGoal();

}

function checkGoal(){

 if(
  ball.x>field.right &&
  ball.y>goal.top &&
  ball.y<goal.bottom
 ){

  myScore++;

  document.getElementById("myScore").innerText=myScore;

  showGoal("GOAL! ⚽");

  resetPositions();
 }

 if(
  ball.x<field.left &&
  ball.y>goal.top &&
  ball.y<goal.bottom
 ){

  aiScore++;

  document.getElementById("aiScore").innerText=aiScore;

  showGoal("AI GOAL!");

  resetPositions();
 }

}

function showGoal(text){

 goalPause=60;

 const msg=document.getElementById("message");

 msg.innerText=text;
 msg.style.display="block";

 setTimeout(()=>{
  msg.style.display="none";
 },900);

}

function updateAI(){

 // AI moves toward ball
 let dx=ball.x-ai.x;
 let dy=ball.y-ai.y;

 let d=Math.hypot(dx,dy);

 if(d>5){

  ai.x+=(dx/d)*ai.speed;
  ai.y+=(dy/d)*ai.speed;
 }

 // Keep AI in field
 ai.x=clamp(ai.x,field.left+20,field.right-20);
 ai.y=clamp(ai.y,field.top+20,field.bottom-20);

 // AI kick
 if(d<45){

  let targetX=field.left-20;
  let targetY=325;

  let kx=targetX-ball.x;
  let ky=targetY-ball.y;

  let len=Math.hypot(kx,ky)||1;

  ball.vx=(kx/len)*7;
  ball.vy=(ky/len)*7;
 }

}

function updateGoalkeepers(){

 // Player goalkeeper
 goalkeeper.y +=
  (ball.y-goalkeeper.y)*0.08;

 goalkeeper.y=clamp(
  goalkeeper.y,
  goal.top+18,
  goal.bottom-18
 );

 // AI goalkeeper
 aiGoalkeeper.y +=
  (ball.y-aiGoalkeeper.y)*0.08;

 aiGoalkeeper.y=clamp(
  aiGoalkeeper.y,
  goal.top+18,
  goal.bottom-18
 );

 // collisions

 if(distance(ball,goalkeeper)<28 && ball.vx>0){

  ball.vx=-Math.abs(ball.vx)*1.1;
  ball.vy+=(ball.y-goalkeeper.y)*.12;

 }

 if(distance(ball,aiGoalkeeper)<28 && ball.vx<0){

  ball.vx=Math.abs(ball.vx)*1.1;
  ball.vy+=(ball.y-aiGoalkeeper.y)*.12;

 }

}

function playerBallCollision(){

 let d=distance(player,ball);

 if(d<player.r+ball.r){

  let dx=ball.x-player.x;
  let dy=ball.y-player.y;

  let len=Math.hypot(dx,dy)||1;

  let overlap=player.r+ball.r-d;

  ball.x+=(dx/len)*overlap;
  ball.y+=(dy/len)*overlap;

  if(!keys["space"]){

   ball.vx+=(dx/len)*.8;
   ball.vy+=(dy/len)*.8;

  }

 }

}

function drawField(){

 ctx.fillStyle="#248b45";
 ctx.fillRect(0,0,W,H);

 // stripes
 for(let x=field.left;x<field.right;x+=120){

  ctx.fillStyle="rgba(255,255,255,.035)";
  ctx.fillRect(x,field.top,60,field.bottom-field.top);

 }

 // outer lines
 ctx.strokeStyle="white";
 ctx.lineWidth=5;

 ctx.strokeRect(
  field.left,
  field.top,
  field.right-field.left,
  field.bottom-field.top
 );

 // halfway line
 ctx.beginPath();
 ctx.moveTo(W/2,field.top);
 ctx.lineTo(W/2,field.bottom);
 ctx.stroke();

 // centre circle
 ctx.beginPath();
 ctx.arc(W/2,325,75,0,Math.PI*2);
 ctx.stroke();

 ctx.beginPath();
 ctx.arc(W/2,325,5,0,Math.PI*2);
 ctx.fillStyle="white";
 ctx.fill();

 // penalty boxes

 ctx.strokeRect(
  field.left,
  205,
  150,
  240
 );

 ctx.strokeRect(
  field.right-150,
  205,
  150,
  240
 );

 // goals

 ctx.fillStyle="rgba(255,255,255,.22)";

 ctx.fillRect(
  field.left-goal.depth,
  goal.top,
  goal.depth,
  goal.bottom-goal.top
 );

 ctx.fillRect(
  field.right,
  goal.top,
  goal.depth,
  goal.bottom-goal.top
 );

}

function drawPlayer(p,color,label){

 ctx.beginPath();
 ctx.arc(p.x,p.y,p.r,0,Math.PI*2);

 ctx.fillStyle=color;
 ctx.fill();

 ctx.strokeStyle="white";
 ctx.lineWidth=2;
 ctx.stroke();

 ctx.fillStyle="white";
 ctx.font="bold 12px Arial";
 ctx.textAlign="center";
 ctx.fillText(label,p.x,p.y-28);
}

function drawBall(){

 ctx.beginPath();
 ctx.arc(ball.x,ball.y,ball.r,0,Math.PI*2);

 ctx.fillStyle="white";
 ctx.fill();

 ctx.strokeStyle="#111";
 ctx.lineWidth=2;
 ctx.stroke();

 // black pentagon-like dot
 ctx.beginPath();
 ctx.arc(ball.x,ball.y,3,0,Math.PI*2);
 ctx.fillStyle="#111";
 ctx.fill();

}

function drawGoalkeeper(g,color){

 ctx.beginPath();
 ctx.arc(g.x,g.y,g.r,0,Math.PI*2);

 ctx.fillStyle=color;
 ctx.fill();

 ctx.strokeStyle="white";
 ctx.lineWidth=2;
 ctx.stroke();

}

function update(){

 if(!running)return;

 if(goalPause>0){
  goalPause--;
  return;
 }

 movePlayer();
 updateAI();
 updateGoalkeepers();
 playerBallCollision();
 ballPhysics();

 if(shotCooldown>0)shotCooldown--;

}

function draw(){

 drawField();

 drawPlayer(player,"#00d9ff","YOU");
 drawPlayer(ai,"#ff4d6d","AI");

 drawGoalkeeper(goalkeeper,"#ffd166");
 drawGoalkeeper(aiGoalkeeper,"#7b2cff");

 drawBall();

}

function loop(){

 update();
 draw();

 if(running)
  requestAnimationFrame(loop);

}

function finishGame(){

 running=false;

 let title="DRAW 🤝";

 if(myScore>aiScore)
  title="YOU WIN! 🏆";

 if(aiScore>myScore)
  title="AI WINS 🤖";

 document.getElementById("endTitle").innerText=title;

 document.getElementById("endScore").innerText=
  "Final Score: "+myScore+" - "+aiScore;

 document.getElementById("end").style.display="flex";

}

// keyboard
document.addEventListener("keydown",e=>{

 keys[e.key]=true;

 if(e.code==="Space"){
  keys["space"]=true;
  kickBall();
 }

});

document.addEventListener("keyup",e=>{

 keys[e.key]=false;

 if(e.code==="Space")
  keys["space"]=false;

});

// touch buttons
function hold(id,key){

 const el=document.getElementById(id);

 el.addEventListener("pointerdown",e=>{
  e.preventDefault();
  keys[key]=true;
 });

 el.addEventListener("pointerup",e=>{
  e.preventDefault();
  keys[key]=false;
 });

 el.addEventListener("pointerleave",()=>{
  keys[key]=false;
 });

}

hold("up","ArrowUp");
hold("down","ArrowDown");
hold("left","ArrowLeft");
hold("right","ArrowRight");
hold("sprint","sprint");

document.getElementById("shoot").addEventListener(
 "pointerdown",
 e=>{
  e.preventDefault();
  kickBall();
 }
);

</script>

</body>
</html>
