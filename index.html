<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Turbo Race</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>

<style>
*{box-sizing:border-box}
body{
 margin:0;background:#101218;color:white;font-family:Arial;
 text-align:center;overflow:hidden
}
h1{margin:10px 0;color:#00e5ff}
button{
 padding:14px 22px;margin:7px;border:0;border-radius:12px;
 font-size:17px;font-weight:bold;cursor:pointer
}
.menu{margin-top:15vh}
#game{display:none}
canvas{
 background:#222;display:block;margin:auto;
 border:3px solid white;max-width:100vw;max-height:75vh
}
#info{font-size:18px;margin:6px}
.controls{display:flex;justify-content:center;gap:20px}
.controls button{
 width:90px;height:60px;background:#333;color:white;font-size:28px
}
#roomBox{display:none;margin:15px}
input{
 padding:13px;border-radius:10px;border:0;font-size:17px;
 width:170px;text-align:center
}
#result{
 display:none;position:fixed;inset:0;background:rgba(0,0,0,.9);
 align-items:center;justify-content:center;flex-direction:column;
 z-index:10
}
</style>
</head>

<body>

<div id="menu" class="menu">
<h1>🏎️ TURBO RACE</h1>
<p>Race against AI or your friend!</p>

<button onclick="startSolo()">🏁 PLAY SOLO</button><br>
<button onclick="createRoom()">👥 CREATE ROOM</button>
<button onclick="showJoin()">🔗 JOIN ROOM</button>

<div id="roomBox">
<input id="roomInput" placeholder="ROOM CODE">
<br>
<button onclick="joinRoom()">JOIN</button>
</div>

<p id="status"></p>
</div>

<div id="game">
<h1>🏎️ TURBO RACE</h1>
<div id="info">Lap 1/3</div>
<canvas id="canvas" width="900" height="600"></canvas>

<div class="controls">
<button id="left">⬅️</button>
<button id="right">➡️</button>
</div>
</div>

<div id="result">
<h1 id="resultText">🏆 FINISH!</h1>
<button onclick="location.reload()">PLAY AGAIN</button>
</div>

<script>
const canvas=document.getElementById("canvas");
const ctx=canvas.getContext("2d");

let mode="solo";
let peer=null;
let conn=null;
let otherPlayer=null;

let keys={left:false,right:false};

const track={
 left:150,
 right:750,
 top:70,
 bottom:530
};

const TOTAL_LAPS=3;

let player={
 x:450,y:470,
 speed:0,
 angle:0,
 lap:1,
 progress:0,
 color:"#00e5ff"
};

let friend={
 x:450,y:430,
 speed:0,
 angle:0,
 lap:1,
 progress:0,
 color:"#ff4081"
};

let ais=[];

function makeAI(x,y,color){
 return {
  x,y,color,
  speed:2.2+Math.random()*0.8,
  progress:0,
  lap:1,
  angle:0
 };
}

function setupAI(n){
 ais=[];
 const colors=["#ffcc00","#ff5722","#9c27b0","#4caf50","#ffffff"];
 for(let i=0;i<n;i++){
  ais.push(makeAI(
   250+i*100,
   390-i*15,
   colors[i]
  ));
 }
}

function startSolo(){
 mode="solo";
 setupAI(4);
 startGame();
}

function showJoin(){
 document.getElementById("roomBox").style.display="block";
}

function createRoom(){
 mode="host";
 document.getElementById("status").innerText="Creating room...";

 peer=new Peer();

 peer.on("open",id=>{
  const code=id.slice(0,6).toUpperCase();
  document.getElementById("status").innerText=
   "ROOM CODE: "+code+"  | Send your link to friend";

  const link=location.href.split("?")[0]+"?room="+id;
  navigator.clipboard?.writeText(link);

  setupAI(3);
  startGame();
 });

 peer.on("connection",c=>{
  conn=c;
  setupConnection();
 });
}

function joinRoom(){
 const code=document.getElementById("roomInput").value.trim();

 if(!code){
  alert("Room code daal bhai!");
  return;
 }

 mode="client";
 peer=new Peer();

 peer.on("open",()=>{
  conn=peer.connect(code);
  setupConnection();
  setupAI(3);
  startGame();
 });
}

function setupConnection(){

 conn.on("open",()=>{
  document.getElementById("status").innerText="Connected to friend! 🔥";
 });

 conn.on("data",data=>{
  if(data.type==="player"){
   friend=data.player;
  }
 });
}

function sendPlayer(){
 if(conn && conn.open){
  conn.send({
   type:"player",
   player:{
    x:player.x,
    y:player.y,
    lap:player.lap,
    progress:player.progress
   }
  });
 }
}

function startGame(){

 document.getElementById("menu").style.display="none";
 document.getElementById("game").style.display="block";

 countdown();
}

function countdown(){

 let n=3;
 const info=document.getElementById("info");

 const timer=setInterval(()=>{
  if(n>0){
   info.innerText=n;
   n--;
  }else{
   info.innerText="GO! 🏁";
   clearInterval(timer);
  }
 },700);
}

function drawTrack(){

 ctx.fillStyle="#222";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 // grass
 ctx.fillStyle="#155c2b";
 ctx.fillRect(0,0,canvas.width,canvas.height);

 // road
 ctx.fillStyle="#444";
 ctx.fillRect(track.left,track.top,
  track.right-track.left,
  track.bottom-track.top);

 // road borders
 ctx.strokeStyle="white";
 ctx.lineWidth=8;
 ctx.strokeRect(track.left,track.top,
  track.right-track.left,
  track.bottom-track.top);

 // centre dashed line
 ctx.strokeStyle="#ddd";
 ctx.lineWidth=4;
 ctx.setLineDash([25,25]);

 ctx.beginPath();
 ctx.moveTo(450,track.top);
 ctx.lineTo(450,track.bottom);
 ctx.stroke();

 ctx.setLineDash([]);

 // finish line
 ctx.fillStyle="white";
 for(let i=0;i<10;i++){
  ctx.fillRect(430+(i%2)*20,track.bottom-15,
   20,8);
 }
}

function drawCar(car,label){

 ctx.save();
 ctx.translate(car.x,car.y);

 ctx.fillStyle=car.color;
 ctx.fillRect(-15,-25,30,50);

 ctx.fillStyle="#111";
 ctx.fillRect(-11,-17,22,13);

 ctx.fillStyle="#111";
 ctx.fillRect(-18,-18,5,12);
 ctx.fillRect(13,-18,5,12);
 ctx.fillRect(-18,8,5,12);
 ctx.fillRect(13,8,5,12);

 ctx.restore();

 if(label){
  ctx.fillStyle="white";
  ctx.font="13px Arial";
  ctx.fillText(label,car.x-15,car.y-32);
 }
}

function updatePlayer(){

 if(keys.left) player.x-=4;
 if(keys.right) player.x+=4;

 player.x=Math.max(track.left+25,
  Math.min(track.right-25,player.x));

 player.y-=1.8;

 if(player.y<track.top+20){
  player.y=track.bottom-30;
  player.lap++;

  if(player.lap>TOTAL_LAPS){
   finish("🏆 YOU WIN!");
  }
 }

 player.progress=(TOTAL_LAPS-player.lap)*600+
  player.y;
}

function updateFriend(){

 if(!otherPlayer)return;

 friend.x += (otherPlayer.x-friend.x)*0.15;
 friend.y += (otherPlayer.y-friend.y)*0.15;
 friend.lap=otherPlayer.lap;
}

function updateAI(ai){

 ai.y-=ai.speed;

 // small random steering
 ai.x += Math.sin(Date.now()/700+ai.x)*0.8;

 ai.x=Math.max(track.left+25,
  Math.min(track.right-25,ai.x));

 if(ai.y<track.top+20){
  ai.y=track.bottom-30;
  ai.lap++;

  if(ai.lap>TOTAL_LAPS){
   ai.lap=TOTAL_LAPS+1;
  }
 }

 ai.progress=(TOTAL_LAPS-ai.lap)*600+ai.y;
}

function collision(a,b){

 return Math.abs(a.x-b.x)<28 &&
        Math.abs(a.y-b.y)<45;
}

function checkCollisions(){

 for(const ai of ais){

  if(collision(player,ai)){
   if(player.x<ai.x) player.x-=5;
   else player.x+=5;
  }
 }

 if(mode!=="solo" && collision(player,friend)){
  if(player.x<friend.x) player.x-=5;
  else player.x+=5;
 }
}

function update(){

 updatePlayer();

 for(const ai of ais)
  updateAI(ai);

 updateFriend();

 checkCollisions();

 sendPlayer();

 document.getElementById("info").innerText=
  "Lap "+Math.min(player.lap,TOTAL_LAPS)+"/"+TOTAL_LAPS+
  "   |   AI: "+ais.length;
}

function draw(){

 drawTrack();

 for(let i=0;i<ais.length;i++)
  drawCar(ais[i],"AI "+(i+1));

 if(mode!=="solo")
  drawCar(friend,"FRIEND");

 drawCar(player,"YOU");
}

function loop(){

 update();
 draw();

 requestAnimationFrame(loop);
}

function finish(text){

 document.getElementById("result").style.display="flex";
 document.getElementById("resultText").innerText=text;
}

document.getElementById("left").ontouchstart=
document.getElementById("left").onmousedown=()=>{
 keys.left=true;
};

document.getElementById("left").ontouchend=
document.getElementById("left").onmouseup=()=>{
 keys.left=false;
};

document.getElementById("right").ontouchstart=
document.getElementById("right").onmousedown=()=>{
 keys.right=true;
};

document.getElementById("right").ontouchend=
document.getElementById("right").onmouseup=()=>{
 keys.right=false;
};

document.addEventListener("keydown",e=>{
 if(e.key==="ArrowLeft")keys.left=true;
 if(e.key==="ArrowRight")keys.right=true;
});

document.addEventListener("keyup",e=>{
 if(e.key==="ArrowLeft")keys.left=false;
 if(e.key==="ArrowRight")keys.right=false;
});

loop();
</script>

</body>
</html>
