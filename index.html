<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Football Clash</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  user-select:none;
  -webkit-user-select:none;
  touch-action:none;
}

body{
  background:#111;
  overflow:hidden;
  font-family:Arial,sans-serif;
}

#game{
  width:100vw;
  height:100vh;
  position:relative;
  overflow:hidden;
  background:#168a42;
}

/* FIELD */
#field{
  position:absolute;
  width:92vw;
  height:72vh;
  left:4vw;
  top:12vh;
  background:
    repeating-linear-gradient(
      90deg,
      #199447 0px,
      #199447 90px,
      #17853e 90px,
      #17853e 180px
    );
  border:5px solid white;
  border-radius:12px;
}

#line{
  position:absolute;
  width:4px;
  height:100%;
  background:white;
  left:50%;
  transform:translateX(-50%);
}

.centerCircle{
  position:absolute;
  width:120px;
  height:120px;
  border:4px solid white;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

.centerDot{
  position:absolute;
  width:10px;
  height:10px;
  background:white;
  border-radius:50%;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
}

/* GOALS */
.goal{
  position:absolute;
  width:32px;
  height:150px;
  top:50%;
  transform:translateY(-50%);
  border:5px solid white;
  background:rgba(255,255,255,.12);
}

#goalLeft{left:-8px;}
#goalRight{right:-8px;}

/* SCORE */
#scoreboard{
  position:absolute;
  top:2vh;
  left:50%;
  transform:translateX(-50%);
  background:rgba(0,0,0,.72);
  color:white;
  padding:9px 22px;
  border-radius:30px;
  font-size:22px;
  font-weight:bold;
  z-index:20;
}

#timer{
  position:absolute;
  top:2vh;
  right:4vw;
  color:white;
  font-size:20px;
  font-weight:bold;
  background:rgba(0,0,0,.65);
  padding:8px 14px;
  border-radius:20px;
  z-index:20;
}

/* PLAYERS */
.player{
  position:absolute;
  width:42px;
  height:42px;
  border-radius:50%;
  border:3px solid white;
  z-index:8;
  display:flex;
  justify-content:center;
  align-items:center;
  font-size:21px;
  box-shadow:0 4px 10px rgba(0,0,0,.35);
}

.you{
  background:#1976ff;
}

.ai{
  background:#e53935;
}

.player::after{
  content:"";
  position:absolute;
  width:8px;
  height:8px;
  background:white;
  border-radius:50%;
  bottom:-7px;
  opacity:.8;
}

/* BALL */
#ball{
  position:absolute;
  width:24px;
  height:24px;
  border-radius:50%;
  background:white;
  border:3px solid #222;
  z-index:10;
  box-shadow:0 2px 5px rgba(0,0,0,.4);
}

/* CONTROLS */
#controls{
  position:absolute;
  inset:0;
  z-index:30;
  pointer-events:none;
}

#joystick{
  position:absolute;
  left:25px;
  bottom:25px;
  width:125px;
  height:125px;
  border-radius:50%;
  background:rgba(255,255,255,.18);
  border:3px solid rgba(255,255,255,.55);
  pointer-events:auto;
}

#stick{
  position:absolute;
  width:58px;
  height:58px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%);
  border-radius:50%;
  background:rgba(255,255,255,.75);
  box-shadow:0 4px 12px rgba(0,0,0,.3);
}

.actions{
  position:absolute;
  right:20px;
  bottom:22px;
  width:180px;
  height:170px;
  pointer-events:none;
}

.btn{
  position:absolute;
  width:72px;
  height:72px;
  border-radius:50%;
  border:3px solid rgba(255,255,255,.8);
  color:white;
  font-weight:bold;
  font-size:12px;
  pointer-events:auto;
  box-shadow:0 5px 12px rgba(0,0,0,.35);
}

.btn:active{
  transform:scale(.88);
}

#shoot{
  right:0;
  top:0;
  background:#e53935;
}

#pass{
  left:0;
  top:48px;
  background:#1976ff;
}

#sprint{
  right:5px;
  bottom:0;
  background:#ff9800;
}

/* MESSAGE */
#message{
  position:absolute;
  inset:0;
  background:rgba(0,0,0,.72);
  display:none;
  align-items:center;
  justify-content:center;
  flex-direction:column;
  color:white;
  z-index:100;
}

#message h1{
  font-size:42px;
  margin-bottom:12px;
}

#restart{
  border:0;
  padding:14px 28px;
  border-radius:30px;
  background:#19c463;
  color:white;
  font-size:18px;
  font-weight:bold;
  margin-top:20px;
}

/* LANDSCAPE WARNING */
#rotate{
  display:none;
}

@media (orientation:portrait){
  #rotate{
    display:none;
  }
}
</style>
</head>

<body>

<div id="game">

  <div id="field">
    <div id="line"></div>
    <div class="centerCircle"></div>
    <div class="centerDot"></div>
    <div id="goalLeft" class="goal"></div>
    <div id="goalRight" class="goal"></div>

    <div id="you" class="player you">⚽</div>

    <div id="ai1" class="player ai">1</div>
    <div id="ai2" class="player ai">2</div>
    <div id="ai3" class="player ai">3</div>

    <div id="ball"></div>
  </div>

  <div id="scoreboard">
    YOU <span id="score">0 - 0</span> AI
  </div>

  <div id="timer">01:30</div>

  <div id="controls">

    <div id="joystick">
      <div id="stick"></div>
    </div>

    <div class="actions">
      <button class="btn" id="shoot">SHOOT</button>
      <button class="btn" id="pass">PASS</button>
      <button class="btn" id="sprint">SPRINT</button>
    </div>

  </div>

  <div id="message">
    <h1 id="result">FULL TIME</h1>
    <div id="finalScore"></div>
    <button id="restart">PLAY AGAIN</button>
  </div>

</div>

<script>

/* =========================
   GAME VARIABLES
========================= */

const field = document.getElementById("field");

const you = document.getElementById("you");
const ai1 = document.getElementById("ai1");
const ai2 = document.getElementById("ai2");
const ai3 = document.getElementById("ai3");
const ball = document.getElementById("ball");

const scoreText = document.getElementById("score");
const timerText = document.getElementById("timer");

const message = document.getElementById("message");
const result = document.getElementById("result");
const finalScore = document.getElementById("finalScore");

const joystick = document.getElementById("joystick");
const stick = document.getElementById("stick");

const shootBtn = document.getElementById("shoot");
const passBtn = document.getElementById("pass");
const sprintBtn = document.getElementById("sprint");

let W, H;

let player = {
  x:0,
  y:0,
  vx:0,
  vy:0
};

let ais = [
  {el:ai1,x:0,y:0,speed:1.35},
  {el:ai2,x:0,y:0,speed:1.2},
  {el:ai3,x:0,y:0,speed:1.45}
];

let ballObj = {
  x:0,
  y:0,
  vx:0,
  vy:0
};

let myScore = 0;
let aiScore = 0;

let timeLeft = 90;

let joystickX = 0;
let joystickY = 0;

let sprinting = false;
let gameRunning = true;


/* =========================
   FIELD SIZE
========================= */

function setup(){

  W = field.clientWidth;
  H = field.clientHeight;

  player.x = W * .25;
  player.y = H * .5;

  ais[0].x = W * .68;
  ais[0].y = H * .35;

  ais[1].x = W * .72;
  ais[1].y = H * .55;

  ais[2].x = W * .60;
  ais[2].y = H * .72;

  ballObj.x = W * .5;
  ballObj.y = H * .5;

  updatePositions();
}

setup();
window.addEventListener("resize",setup);


/* =========================
   POSITION UPDATE
========================= */

function updatePositions(){

  you.style.left = (player.x - 21) + "px";
  you.style.top = (player.y - 21) + "px";

  ais.forEach(a=>{
    a.el.style.left = (a.x - 21) + "px";
    a.el.style.top = (a.y - 21) + "px";
  });

  ball.style.left = (ballObj.x - 12) + "px";
  ball.style.top = (ballObj.y - 12) + "px";
}


/* =========================
   JOYSTICK
========================= */

let joystickActive = false;

function moveJoystick(clientX,clientY){

  const rect = joystick.getBoundingClientRect();

  const cx = rect.left + rect.width/2;
  const cy = rect.top + rect.height/2;

  let dx = clientX - cx;
  let dy = clientY - cy;

  const max = 43;

  const distance = Math.sqrt(dx*dx + dy*dy);

  if(distance > max){

    dx = dx / distance * max;
    dy = dy / distance * max;

  }

  joystickX = dx / max;
  joystickY = dy / max;

  stick.style.transform =
    `translate(calc(-50% + ${dx}px), calc(-50% + ${dy}px))`;
}

joystick.addEventListener("touchstart",e=>{
  joystickActive = true;
  moveJoystick(
    e.touches[0].clientX,
    e.touches[0].clientY
  );
},{passive:false});

joystick.addEventListener("touchmove",e=>{
  if(!joystickActive)return;

  moveJoystick(
    e.touches[0].clientX,
    e.touches[0].clientY
  );
},{passive:false});

joystick.addEventListener("touchend",()=>{
  joystickActive=false;
  joystickX=0;
  joystickY=0;

  stick.style.transform="translate(-50%,-50%)";
});


/* =========================
   SPRINT
========================= */

sprintBtn.addEventListener("touchstart",()=>{
  sprinting=true;
});

sprintBtn.addEventListener("touchend",()=>{
  sprinting=false;
});

sprintBtn.addEventListener("touchcancel",()=>{
  sprinting=false;
});


/* =========================
   DISTANCE
========================= */

function distance(a,b){

  const dx=a.x-b.x;
  const dy=a.y-b.y;

  return Math.sqrt(dx*dx+dy*dy);
}


/* =========================
   PLAYER MOVEMENT
========================= */

function movePlayer(){

  const baseSpeed = sprinting ? 4.4 : 2.7;

  player.x += joystickX * baseSpeed;
  player.y += joystickY * baseSpeed;

  player.x = Math.max(25,Math.min(W-25,player.x));
  player.y = Math.max(25,Math.min(H-25,player.y));
}


/* =========================
   AI MOVEMENT
========================= */

function moveAI(){

  ais.forEach((a,index)=>{

    let targetX = ballObj.x;
    let targetY = ballObj.y;

    /* different AI behaviour */

    if(index === 1){
      targetX += 45;
      targetY += 25;
    }

    if(index === 2){
      targetX -= 35;
      targetY -= 30;
    }

    let dx = targetX-a.x;
    let dy = targetY-a.y;

    let d = Math.sqrt(dx*dx+dy*dy);

    if(d > 5){

      a.x += dx/d*a.speed;
      a.y += dy/d*a.speed;

    }

    a.x = Math.max(25,Math.min(W-25,a.x));
    a.y = Math.max(25,Math.min(H-25,a.y));

  });
}


/* =========================
   BALL PHYSICS
========================= */

function moveBall(){

  ballObj.x += ballObj.vx;
  ballObj.y += ballObj.vy;

  ballObj.vx *= .97;
  ballObj.vy *= .97;

  /* top bottom */

  if(ballObj.y < 15){

    ballObj.y=15;
    ballObj.vy*=-.7;

  }

  if(ballObj.y > H-15){

    ballObj.y=H-15;
    ballObj.vy*=-.7;

  }

  /* left goal */

  if(ballObj.x < 0){

    if(ballObj.y > H/2-75 && ballObj.y < H/2+75){

      myScore++;
      resetBall();

    }else{

      ballObj.x=15;
      ballObj.vx*=-.7;

    }

  }

  /* right goal */

  if(ballObj.x > W){

    if(ballObj.y > H/2-75 && ballObj.y < H/2+75){

      aiScore++;
      resetBall();

    }else{

      ballObj.x=W-15;
      ballObj.vx*=-.7;

    }

  }

}


/* =========================
   BALL + PLAYER COLLISION
========================= */

function playerBallCollision(){

  let d = distance(player,ballObj);

  if(d < 37){

    let dx = ballObj.x-player.x;
    let dy = ballObj.y-player.y;

    let len = Math.sqrt(dx*dx+dy*dy)||1;

    ballObj.x = player.x + dx/len*38;
    ballObj.y = player.y + dy/len*38;

    ballObj.vx += dx/len*.35;
    ballObj.vy += dy/len*.35;

  }

  /* AI can touch ball */

  ais.forEach(a=>{

    let d = distance(a,ballObj);

    if(d < 36){

      let dx=ballObj.x-a.x;
      let dy=ballObj.y-a.y;

      let len=Math.sqrt(dx*dx+dy*dy)||1;

      ballObj.vx += dx/len*.20;
      ballObj.vy += dy/len*.20;

    }

  });

}


/* =========================
   SHOOT
========================= */

shootBtn.addEventListener("touchstart",()=>{

  if(!gameRunning)return;

  let d = distance(player,ballObj);

  if(d < 70){

    let dx = joystickX;
    let dy = joystickY;

    if(Math.abs(dx)+Math.abs(dy)<.2){

      dx=1;
      dy=0;

    }

    ballObj.vx = dx*9;
    ballObj.vy = dy*9;

  }

});


/* =========================
   PASS
========================= */

passBtn.addEventListener("touchstart",()=>{

  if(!gameRunning)return;

  let d=distance(player,ballObj);

  if(d<80){

    let nearest=ais[0];

    let best=distance(player,nearest);

    ais.forEach(a=>{

      let dd=distance(player,a);

      if(dd<best){

        best=dd;
        nearest=a;

      }

    });

    let dx=nearest.x-ballObj.x;
    let dy=nearest.y-ballObj.y;

    let len=Math.sqrt(dx*dx+dy*dy)||1;

    ballObj.vx=dx/len*6;
    ballObj.vy=dy/len*6;

  }

});


/* =========================
   AI SHOOT
========================= */

function aiShoot(){

  ais.forEach(a=>{

    let d=distance(a,ballObj);

    if(d<45){

      /* occasionally kick toward left goal */

      if(Math.random()<.025){

        let dx=-W-ballObj.x;
        let dy=H/2-ballObj.y;

        let len=Math.sqrt(dx*dx+dy*dy)||1;

        ballObj.vx=dx/len*6;
        ballObj.vy=dy/len*6;

      }

    }

  });

}


/* =========================
   RESET BALL
========================= */

function resetBall(){

  ballObj.x=W/2;
  ballObj.y=H/2;

  ballObj.vx=0;
  ballObj.vy=0;

  player.x=W*.25;
  player.y=H*.5;

}


/* =========================
   SCORE UPDATE
========================= */

function updateScore(){

  scoreText.textContent =
    `${myScore} - ${aiScore}`;

}


/* =========================
   TIMER
========================= */

setInterval(()=>{

  if(!gameRunning)return;

  timeLeft--;

  let min=Math.floor(timeLeft/60);
  let sec=timeLeft%60;

  timerText.textContent =
    `${String(min).padStart(2,"0")}:${String(sec).padStart(2,"0")}`;

  if(timeLeft<=0){

    endGame();

  }

},1000);


/* =========================
   GAME OVER
========================= */

function endGame(){

  gameRunning=false;

  result.textContent="FULL TIME";

  finalScore.textContent=
    `Final Score: ${myScore} - ${aiScore}`;

  message.style.display="flex";

}


/* =========================
   RESTART
========================= */

document.getElementById("restart").addEventListener("click",()=>{

  myScore=0;
  aiScore=0;
  timeLeft=90;

  gameRunning=true;

  message.style.display="none";

  resetBall();

  ais[0].x=W*.68;
  ais[0].y=H*.35;

  ais[1].x=W*.72;
  ais[1].y=H*.55;

  ais[2].x=W*.60;
  ais[2].y=H*.72;

});


/* =========================
   MAIN GAME LOOP
========================= */

function gameLoop(){

  if(gameRunning){

    movePlayer();
    moveAI();
    moveBall();

    playerBallCollision();
    aiShoot();

    updateScore();
    updatePositions();

  }

  requestAnimationFrame(gameLoop);

}

gameLoop();

</script>

</body>
</html>
