<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Ninja Survival</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    touch-action:none;
    user-select:none;
}

body{
    overflow:hidden;
    background:#050509;
    font-family:Arial,sans-serif;
}

canvas{
    display:block;
    width:100vw;
    height:100vh;
    background:#080914;
}

#ui{
    position:fixed;
    top:15px;
    left:15px;
    right:15px;
    display:flex;
    justify-content:space-between;
    color:white;
    font-weight:bold;
    font-size:18px;
    z-index:5;
}

#healthBox{
    position:fixed;
    left:15px;
    bottom:25px;
    width:150px;
    height:18px;
    border:2px solid white;
    border-radius:12px;
    overflow:hidden;
    background:#222;
}

#health{
    width:100%;
    height:100%;
    background:#32e875;
}

#joystick{
    position:fixed;
    left:25px;
    bottom:60px;
    width:125px;
    height:125px;
    border-radius:50%;
    background:rgba(255,255,255,.08);
    border:2px solid rgba(255,255,255,.25);
}

#stick{
    position:absolute;
    width:55px;
    height:55px;
    border-radius:50%;
    background:rgba(100,220,255,.65);
    left:33px;
    top:33px;
}

#attack{
    position:fixed;
    right:30px;
    bottom:65px;
    width:100px;
    height:100px;
    border-radius:50%;
    border:3px solid white;
    background:rgba(255,60,80,.7);
    color:white;
    font-size:20px;
    font-weight:bold;
}

#gameOver{
    position:fixed;
    inset:0;
    display:none;
    align-items:center;
    justify-content:center;
    flex-direction:column;
    background:rgba(0,0,0,.75);
    color:white;
    z-index:10;
}

#gameOver h1{
    font-size:48px;
    margin-bottom:10px;
}

#gameOver p{
    font-size:22px;
    margin-bottom:20px;
}

#restart{
    padding:15px 30px;
    border:0;
    border-radius:12px;
    background:#19e6ff;
    font-size:20px;
    font-weight:bold;
}
</style>
</head>

<body>

<canvas id="game"></canvas>

<div id="ui">
    <div>🥷 SCORE: <span id="score">0</span></div>
    <div>💰 <span id="coins">0</span></div>
    <div>🌊 WAVE: <span id="wave">1</span></div>
</div>

<div id="healthBox">
    <div id="health"></div>
</div>

<div id="joystick">
    <div id="stick"></div>
</div>

<button id="attack">⚔️</button>

<div id="gameOver">
    <h1>GAME OVER</h1>
    <p>Score: <span id="finalScore">0</span></p>
    <button id="restart">PLAY AGAIN</button>
</div>

<script>

const canvas = document.getElementById("game");
const ctx = canvas.getContext("2d");

let W,H;

function resize(){
    W = canvas.width = innerWidth;
    H = canvas.height = innerHeight;
}

resize();
addEventListener("resize",resize);

let player;
let enemies=[];
let coins=[];
let particles=[];

let score=0;
let coinCount=0;
let health=100;
let wave=1;
let gameRunning=true;

let joystick={
    active:false,
    x:0,
    y:0
};

let attack=false;
let lastSpawn=0;
let lastCoin=0;

function reset(){

    player={
        x:W/2,
        y:H/2,
        r:23,
        speed:4.5,
        angle:0,
        attackTimer:0,
        invincible:0
    };

    enemies=[];
    coins=[];
    particles=[];

    score=0;
    coinCount=0;
    health=100;
    wave=1;
    gameRunning=true;

    document.getElementById("gameOver").style.display="none";

    updateUI();
}

reset();


// ---------------- PARTICLES ----------------

function particle(x,y,color){

    particles.push({
        x:x,
        y:y,
        vx:(Math.random()-.5)*5,
        vy:(Math.random()-.5)*5,
        life:30,
        color:color
    });

}


// ---------------- ENEMIES ----------------

function spawnEnemy(){

    let side=Math.floor(Math.random()*4);

    let x,y;

    if(side===0){
        x=Math.random()*W;
        y=-40;
    }

    if(side===1){
        x=W+40;
        y=Math.random()*H;
    }

    if(side===2){
        x=Math.random()*W;
        y=H+40;
    }

    if(side===3){
        x=-40;
        y=Math.random()*H;
    }

    let type=Math.random();

    let enemy;

    if(type<.25){

        enemy={
            x,y,
            r:27,
            speed:1.35+wave*.05,
            hp:3,
            color:"#b44cff"
        };

    }else{

        enemy={
            x,y,
            r:20,
            speed:1.7+wave*.08,
            hp:2,
            color:"#ff405d"
        };

    }

    enemies.push(enemy);
}


// ---------------- COINS ----------------

function spawnCoin(){

    coins.push({
        x:40+Math.random()*(W-80),
        y:80+Math.random()*(H-160),
        r:10,
        rot:0
    });

}


// ---------------- DRAW BACKGROUND ----------------

function drawBackground(){

    let g=ctx.createRadialGradient(
        W/2,H/2,50,
        W/2,H/2,Math.max(W,H)
    );

    g.addColorStop(0,"#18214a");
    g.addColorStop(1,"#050509");

    ctx.fillStyle=g;
    ctx.fillRect(0,0,W,H);

    // city lights

    for(let i=0;i<35;i++){

        let x=(i*137)%W;
        let y=(i*83)%H;

        ctx.fillStyle="rgba(80,180,255,.08)";
        ctx.fillRect(x,y,3,3);

    }

}


// ---------------- PLAYER ----------------

function drawPlayer(){

    ctx.save();

    ctx.translate(player.x,player.y);

    ctx.rotate(player.angle);

    // shadow
    ctx.fillStyle="rgba(0,0,0,.4)";
    ctx.beginPath();
    ctx.ellipse(0,20,25,10,0,0,Math.PI*2);
    ctx.fill();

    // body
    ctx.fillStyle="#15151d";
    ctx.beginPath();
    ctx.arc(0,0,player.r,0,Math.PI*2);
    ctx.fill();

    // head
    ctx.fillStyle="#242430";
    ctx.beginPath();
    ctx.arc(0,-5,17,0,Math.PI*2);
    ctx.fill();

    // mask
    ctx.fillStyle="#101015";
    ctx.fillRect(-18,-8,36,10);

    // eyes
    ctx.fillStyle="#36e8ff";

    ctx.fillRect(-11,-7,7,3);
    ctx.fillRect(4,-7,7,3);

    // scarf
    ctx.fillStyle="#ff315a";
    ctx.fillRect(-20,5,40,7);

    // sword
    if(player.attackTimer>0){

        ctx.strokeStyle="#dffcff";
        ctx.lineWidth=7;

        ctx.beginPath();
        ctx.moveTo(8,-5);
        ctx.lineTo(50,-38);
        ctx.stroke();

        ctx.strokeStyle="#42eaff";
        ctx.lineWidth=2;

        ctx.beginPath();
        ctx.moveTo(10,-7);
        ctx.lineTo(50,-40);
        ctx.stroke();

    }

    ctx.restore();

}


// ---------------- ENEMY ----------------

function drawEnemy(e){

    ctx.save();

    ctx.translate(e.x,e.y);

    ctx.fillStyle="rgba(0,0,0,.4)";
    ctx.beginPath();
    ctx.ellipse(0,18,e.r,8,0,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle=e.color;

    ctx.beginPath();
    ctx.arc(0,0,e.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#160914";

    ctx.beginPath();
    ctx.arc(0,-4,e.r*.65,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#fff";

    ctx.fillRect(-9,-5,5,3);
    ctx.fillRect(4,-5,5,3);

    ctx.restore();

}


// ---------------- COIN ----------------

function drawCoin(c){

    c.rot+=.08;

    ctx.save();

    ctx.translate(c.x,c.y);

    let scale=Math.abs(Math.cos(c.rot));

    ctx.scale(scale,1);

    ctx.fillStyle="#ffd83d";

    ctx.beginPath();
    ctx.arc(0,0,c.r,0,Math.PI*2);
    ctx.fill();

    ctx.fillStyle="#fff4a3";
    ctx.font="bold 12px Arial";
    ctx.textAlign="center";
    ctx.textBaseline="middle";
    ctx.fillText("$",0,0);

    ctx.restore();

}


// ---------------- ATTACK ----------------

function doAttack(){

    if(!gameRunning)return;

    player.attackTimer=12;

    for(let e of enemies){

        let dx=e.x-player.x;
        let dy=e.y-player.y;

        let d=Math.hypot(dx,dy);

        if(d<85){

            e.hp--;

            particle(e.x,e.y,"#ff4265");

            if(e.hp<=0){

                score+=10;

                for(let i=0;i<8;i++)
                    particle(e.x,e.y,e.color);

            }

        }

    }

}


// ---------------- UPDATE ----------------

function update(){

    if(!gameRunning)return;

    // player movement

    player.x += joystick.x * player.speed;
    player.y += joystick.y * player.speed;

    player.x=Math.max(25,Math.min(W-25,player.x));
    player.y=Math.max(60,Math.min(H-25,player.y));

    if(Math.abs(joystick.x)+Math.abs(joystick.y)>.1){

        player.angle=Math.atan2(
            joystick.y,
            joystick.x
        );

    }

    if(player.attackTimer>0)
        player.attackTimer--;

    if(player.invincible>0)
        player.invincible--;


    // spawn enemies

    let spawnDelay=Math.max(350,1000-wave*55);

    if(Date.now()-lastSpawn>spawnDelay){

        spawnEnemy();

        lastSpawn=Date.now();

    }


    // coins

    if(Date.now()-lastCoin>4000){

        spawnCoin();

        lastCoin=Date.now();

    }


    // enemies

    for(let i=enemies.length-1;i>=0;i--){

        let e=enemies[i];

        let dx=player.x-e.x;
        let dy=player.y-e.y;

        let d=Math.hypot(dx,dy);

        if(d>0){

            e.x += dx/d*e.speed;
            e.y += dy/d*e.speed;

        }


        if(d<player.r+e.r){

            if(player.invincible<=0){

                health-=8;

                player.invincible=45;

                particle(player.x,player.y,"#ff304f");

            }

        }


        if(e.hp<=0){

            enemies.splice(i,1);

            continue;

        }

    }


    // coins collision

    for(let i=coins.length-1;i>=0;i--){

        let c=coins[i];

        let d=Math.hypot(
            player.x-c.x,
            player.y-c.y
        );

        if(d<player.r+c.r){

            coinCount++;

            score+=5;

            for(let j=0;j<8;j++)
                particle(c.x,c.y,"#ffd83d");

            coins.splice(i,1);

        }

    }


    // particles

    for(let i=particles.length-1;i>=0;i--){

        let p=particles[i];

        p.x+=p.vx;
        p.y+=p.vy;
        p.life--;

        if(p.life<=0)
            particles.splice(i,1);

    }


    // wave

    wave=1+Math.floor(score/100);


    if(health<=0){

        gameRunning=false;

        document.getElementById("finalScore").textContent=score;

        document.getElementById("gameOver").style.display="flex";

    }

    updateUI();

}


// ---------------- UI ----------------

function updateUI(){

    document.getElementById("score").textContent=score;
    document.getElementById("coins").textContent=coinCount;
    document.getElementById("wave").textContent=wave;

    document.getElementById("health").style.width=
        Math.max(0,health)+"%";

}


// ---------------- DRAW ----------------

function draw(){

    drawBackground();

    for(let c of coins)
        drawCoin(c);

    for(let e of enemies)
        drawEnemy(e);

    for(let p of particles){

        ctx.globalAlpha=p.life/30;

        ctx.fillStyle=p.color;

        ctx.beginPath();

        ctx.arc(
            p.x,
            p.y,
            4,
            0,
            Math.PI*2
        );

        ctx.fill();

    }

    ctx.globalAlpha=1;

    if(player.invincible%6<3 && player.invincible>0){

    }else{

        drawPlayer();

    }

}


// ---------------- LOOP ----------------

function loop(){

    update();
    draw();

    requestAnimationFrame(loop);

}

loop();


// ---------------- JOYSTICK ----------------

const joystickBox=document.getElementById("joystick");
const stick=document.getElementById("stick");

function joystickMove(e){

    if(!joystick.active)return;

    let rect=joystickBox.getBoundingClientRect();

    let cx=rect.left+rect.width/2;
    let cy=rect.top+rect.height/2;

    let x=e.clientX-cx;
    let y=e.clientY-cy;

    let max=42;

    let d=Math.hypot(x,y);

    if(d>max){

        x=x/d*max;
        y=y/d*max;

    }

    stick.style.left=(33+x)+"px";
    stick.style.top=(33+y)+"px";

    joystick.x=x/max;
    joystick.y=y/max;

}

function joystickEnd(){

    joystick.active=false;

    joystick.x=0;
    joystick.y=0;

    stick.style.left="33px";
    stick.style.top="33px";

}

joystickBox.addEventListener("pointerdown",e=>{

    joystick.active=true;

    joystickMove(e);

});

window.addEventListener("pointermove",joystickMove);

window.addEventListener("pointerup",joystickEnd);


// ---------------- ATTACK BUTTON ----------------

document.getElementById("attack")
.addEventListener("pointerdown",doAttack);


// ---------------- RESTART ----------------

document.getElementById("restart")
.addEventListener("click",()=>{

    reset();

});

</script>

</body>
</html>
