<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Catch the Heart ❤️</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #ff758c, #ff7eb3);
        overflow: hidden;
        height: 100vh;
        text-align: center;
    }

    #game {
        width: 100%;
        height: 100vh;
        position: relative;
    }

    h1 {
        color: white;
        padding-top: 20px;
        font-size: 32px;
        text-shadow: 2px 2px 5px #b30059;
    }

    #score {
        color: white;
        font-size: 22px;
        margin-top: 10px;
    }

    #heart {
        position: absolute;
        font-size: 55px;
        cursor: pointer;
        user-select: none;
        transition: 0.1s;
    }

    #message {
        display: none;
        position: absolute;
        top: 40%;
        width: 100%;
        color: white;
        font-size: 30px;
        font-weight: bold;
        text-shadow: 2px 2px 5px #b30059;
        padding: 20px;
    }

    button {
        margin-top: 20px;
        padding: 12px 25px;
        border: none;
        border-radius: 25px;
        background: white;
        color: #ff4081;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }
</style>
</head>

<body>

<div id="game">

    <h1>Catch the Heart ❤️</h1>
    <div id="score">Score: 0</div>

    <div id="heart">❤️</div>

    <div id="message">
        🎉 You Won! 🎉<br>
        You caught all the hearts ❤️<br>
        <button onclick="restartGame()">Play Again</button>
    </div>

</div>

<script>

let score = 0;
let target = 15;

const heart = document.getElementById("heart");
const scoreText = document.getElementById("score");
const message = document.getElementById("message");

function moveHeart() {

    let x = Math.random() * (window.innerWidth - 80);
    let y = 100 + Math.random() * (window.innerHeight - 180);

    heart.style.left = x + "px";
    heart.style.top = y + "px";
}

heart.addEventListener("click", function() {

    score++;

    scoreText.innerText = "Score: " + score;

    if (score >= target) {

        heart.style.display = "none";
        message.style.display = "block";

    } else {

        moveHeart();

    }

});

function restartGame() {

    score = 0;

    scoreText.innerText = "Score: 0";

    message.style.display = "none";

    heart.style.display = "block";

    moveHeart();
}

moveHeart();

</script>

</body>
</html>
